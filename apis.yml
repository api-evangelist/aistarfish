description: 'aistarfish (aistarfish.com) is the web home of Haixin Health (海心健康),
  a Chinese digital-health company operated by Zhejiang Haixin Zhihui Technology Co.,
  Ltd. that provides full-course disease management and support services for cancer
  patients across their entire treatment journey. Its consumer-facing products are
  iOS and Android mobile apps built around a patient community, peer-support networks,
  patient and official medical diaries, and patient-to-doctor connections, under the
  mission of "helping cancer patients live longer and live better." The company holds
  an Internet Pharmaceutical Information Service qualification. It is surfaced here
  as a portfolio company of the Qiming venture network. As of this pass it publishes
  no public developer portal, API documentation, or machine-readable API surface.'
